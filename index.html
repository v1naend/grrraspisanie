ng-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171c;--fg:#e8eaed;--mut:#9aa0a6;--line:#3a3f48;--head:#2f6fdc;--tint:#1f2a3d;--l:24%;--s:35%;--tc:#eee;--br:#1e2128;--hol:#3a1f22;--holc:#ff8a80}}
:root[data-theme="dark"]{--bg:#15171c;--fg:#e8eaed;--mut:#9aa0a6;--line:#3a3f48;--head:#2f6fdc;--tint:#1f2a3d;--l:24%;--s:35%;--tc:#eee;--br:#1e2128;--hol:#3a1f22;--holc:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:12px;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;max-width:900px;margin:0 auto}
h1{font-size:18px;margin:4px 0 10px}
.tabs{display:flex;gap:8px;margin-bottom:8px}
.tabs button{flex:1;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:600 14px system-ui;cursor:pointer}
.tabs button.on{background:var(--head);color:#fff;border-color:var(--head)}
.cal{display:grid;grid-template-columns:38px repeat(7,1fr);gap:2px}
.hd{font-size:11px;color:var(--mut);text-align:center;padding:2px 0}
.wl{display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:10px;font-weight:700;text-align:center;border:1px solid var(--line);color:var(--mut);cursor:pointer}
.wl.x{opacity:.3;cursor:default}
.dc{min-height:56px;border:1px solid var(--line);border-radius:6px;padding:3px 4px;font-size:11px;cursor:pointer;position:relative;overflow:hidden}
.dc b{font-size:13px}
.dc small{display:block;color:var(--mut);font-size:10px;margin-top:2px}
.dc.out{opacity:.4}.dc.x{opacity:.25;cursor:default}.dc.past{opacity:.5}
.dc.hol{background:var(--hol)}.dc.hol b,.dc.hol small{color:var(--holc)}
.dc.today b{background:#f5b400;color:#000;border-radius:10px;padding:0 5px}
.row-sel .dc,.row-sel .wl{background-color:var(--tint)}
.row-sel .dc.hol{background:var(--hol)}
.row-sel .wl{background:var(--head);color:#fff;border-color:var(--head)}
.dc.sel{outline:2px solid var(--head);outline-offset:-2px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:2px}
.lg{font-size:12px;color:var(--mut);line-height:1.7;margin:8px 0}
#det{margin-top:14px}
.w{margin:6px 0;font-weight:700}
.bn{font-size:12px;color:var(--holc);margin:4px 0}
.sc{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.tw{position:relative;min-width:730px}
table{border-collapse:collapse;position:relative;z-index:1;width:100%;table-layout:fixed}
th,td{border:1px solid var(--line);padding:3px 5px;font-size:11px;vertical-align:top;height:36px;overflow-wrap:anywhere}
th{background:var(--head);color:#fff;height:auto;padding:6px 4px}
th.hol{background:#c62828}
th.sel{outline:3px solid #f5b400;outline-offset:-3px}
.t{width:50px;position:sticky;left:0;background:var(--bg);color:var(--mut);font-size:10px;text-align:center;z-index:1}
th.t{background:var(--head);color:#fff}
.c{background:hsl(var(--h) var(--s) var(--l));color:var(--tc)}
.c b{display:block;font-weight:600}.c i{font-style:normal;opacity:.75}
.add{outline:2px solid #1a9c4a;outline-offset:-2px}
.del{outline:2px dashed #d33;outline-offset:-2px;opacity:.6}.del b{text-decoration:line-through}
tr.br td{height:auto;text-align:center;color:var(--mut);font-size:10px;background:var(--br);padding:2px}
.sw{display:none}
.dt{display:none;gap:4px;margin:6px 0}
.dt button{flex:1;padding:6px 0;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:600 12px/1.3 system-ui;cursor:pointer}
.dt button.on{background:var(--head);color:#fff;border-color:var(--head)}
.dt button.h{color:var(--holc);border-color:var(--holc)}
.dt button.on.h{background:#c62828;color:#fff}
@media (max-width:699px){
body{padding:8px}
.dt{display:flex}
:root{--tw:58px}
#det{min-height:100vh;min-height:100svh}
.tw{min-width:0}
.sc{overflow-x:visible}
th,td{font-size:13px;height:46px;padding:5px 8px}
.t{width:58px;font-size:11px}

.dc small{font-size:9px}
.sw{display:inline}
tr.br td{font-size:11px}
}
.hbg{position:absolute;top:0;bottom:0;background:var(--img) center/cover;opacity:.5;z-index:0;pointer-events:none}
.c.hl{background:hsl(var(--h) var(--s) var(--l) / .55)}
.dc.r7::before{content:"";position:absolute;inset:0;background:var(--img) center/cover;opacity:.4;pointer-events:none}
.dc>*{position:relative}
:root{--ses:#fff1d6;--sesc:#a35f00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ses:#3a2f14;--sesc:#ffb74d}}
.dc.ses{background:var(--ses)}.dc.ses b,.dc.ses small{color:var(--sesc)}

<div class="tabs"><button id="b9">Октябрь</button><button id="b10">Ноябрь</button><button id="b11">Декабрь</button><button id="b0">Январь</button></div>
<div class="cal" id="cal"></div>
<div class="lg">Нажмите на день или на «Нед.» слева — ниже откроется расписание этой недели.<span class="sw"> На телефоне: свайп по таблице меняет день, по календарю — месяц.</span><br>
<span class="dot" style="background:#1a9c4a"></span>доп. пара · <span class="dot" style="background:#d33"></span>отмена · <span style="color:var(--holc)">красный фон</span> – праздничный день · <span style="color:var(--sesc)">оранжевый</span> – сессия</div>
<div id="det"></div>
<script>
const F=[1,1,'Физ-ра','с/з'],M=[3,2,'Матем. в проф. деят.','302'],H=[2,2,'Ист. Бел. Государственности','310'];
const MON=[F,[2,2,'Иностранный язык','119, 168'],[3,2,'Инженерная графика','317, 319'],[4,2,'Тех. Электроника','110']];
const A=[MON,
[[0,2,'Общая физика','216'],[1,2,'ТЭЦ','206'],H,M],
[[0,2,'Иностранный язык','213, 216'],[1,0,'Охрана труда','219'],F,[2,2,'Матем. в проф. деят.','302']],
[[1,2,'Охрана труда','201'],[2,2,'ТЭЦ','206'],[3,2,'Ист. Бел. Государственности','310']],
[[0,2,'Сетевые технологии','104'],[1,0,'Астрономия','311'],F,[2,2,'Общая физика','311']],
[[1,2,'Астрономия','309'],[2,2,'Инф. Технологии','321, 318'],[3,2,'Охрана окр. сред.','311']]];
const B=[MON,
[[0,2,'Общая физика','216'],[1,2,'ТЭЦ','206'],H,M],
[[1,0,'Охрана труда','219'],F,[2,2,'Матем. в проф. деят.','302'],[3,2,'Тех. Электроника','110']],
[[0,2,'Инф. Технологии','321, 318'],[1,2,'Охрана труда','201'],[2,2,'ТЭЦ','206']],
A[4],
[[2,2,'Инф. Технологии','321, 318'],[3,2,'Охрана окр. сред.','311']]];
const OT=(h,r)=>[3,h,'Охрана труда',r],HI=[4,2,'Ист. Бел. Государственности',''];
const DEL={'27.10':'Ист.','29.10':'Ист.'};
const ADD={'21.10':[[4,2,'Охрана окр. сред.','311']],'20.11':[HI],'27.11':[HI],'11.11':[OT(0,'211')],'19.11':[OT(2,'308')],'25.11':[OT(0,'211')],'03.12':[OT(2,'308')],'09.12':[OT(0,'211')],'11.12':[HI],'17.12':[OT(2,'308')],'23.12':[OT(0,'211')]};
const HOL={'07.11':'День Октябрьской революции','25.12':'Рождество Христово (католическое)','01.01':'Новый год','02.01':'Новый год','07.01':'Рождество Христово (православное)'};
const SES=dt=>dt>=new Date(2027,0,5)&&dt<=new Date(2027,0,11);
const T=[['08:00','08:45','08:55','09:40'],['09:55','10:40','10:50','11:35'],['12:15','13:00','13:10','13:55'],['14:10','14:55','15:05','15:50'],['16:20','17:05','17:15','18:00']];
const DN=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'],MN=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate()),p2=n=>String(n).padStart(2,'0');
const key=d=>p2(d.getDate())+'.'+p2(d.getMonth()+1);
const dateOf=(i,d)=>new Date(2026,9,12+i*7+d);
function les(i,d){const k=key(dateOf(i,d));
 let L=d>5?[]:(i%2?B:A)[d].map(x=>x.slice());
 const dl=DEL[k];if(dl)L=L.map(x=>x[2].startsWith(dl)?x.concat('del'):x);
 (ADD[k]||[]).forEach(x=>L.push(x.concat('add')));
 if(HOL[k])L=L.map(x=>x.slice(0,4).concat('hol'));
 if(SES(dateOf(i,d)))L=[];
 return L}
let mon=9,sel=0,selDay=0;
(()=>{const n=Math.round((today-new Date(2026,9,12))/864e5);if(n>=0&&n<98){sel=Math.floor(n/7);selDay=n%7;const m=today.getMonth();if([9,10,11,0].includes(m))mon=m}else if(n>=98){sel=13;selDay=0;mon=0}})();
function renderCal(){
 const Y=mon===0?2027:2026,first=new Date(Y,mon,1),off=(first.getDay()+6)%7,last=new Date(Y,mon+1,0);
 let h='<div></div>'+DN.map(n=>`<div class="hd">${n}</div>`).join('');
 const w0=new Date(Y,mon,1-off);
 for(let r=0;;r++){
  const ws=new Date(w0.getFullYear(),w0.getMonth(),w0.getDate()+r*7);
  if(ws>last)break;
  const i=Math.round((ws-new Date(2026,9,12))/(7*864e5)),ok=i>=0&&i<=13,rs=ok&&i===sel;
  h+=`<div style="display:contents" class="${rs?'row-sel':''}"><div class="wl ${ok?'':'x'}" ${ok?`data-i="${i}"`:''}>${ok?'Нед.<br>'+(i%2+1):'–'}</div>`;
  for(let d=0;d<7;d++){
   const dt=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+d),k=key(dt);
   let inner=`<b>${dt.getDate()}</b>`,cls=['dc'];
   if(dt.getMonth()!==mon)cls.push('out');
   if(!ok)cls.push('x');
   if(ok&&dt<today)cls.push('past');
   if(ok&&dt.getTime()===today.getTime())cls.push('today');
   if(ok&&rs&&selDay===d)cls.push('sel');
   if(ok){
    const L=les(i,d);
    if(HOL[k]){cls.push('hol');if(k==='07.11')cls.push('r7');inner+='<small>праздник</small>'}
    else if(SES(dt)){cls.push('ses');inner+='<small>сессия</small>'}
    else if(d===6)inner+='<small>—</small>';
    else{
     const n=L.filter(x=>!x[4]||x[4]==='add').length;
     inner+=`<small>${n} зан.</small>`;
     if(L.some(x=>x[4]==='add'))inner+='<span class="dot" style="background:#1a9c4a"></span>';
     if(L.some(x=>x[4]==='del'))inner+='<span class="dot" style="background:#d33"></span>';
    }
   }
   h+=`<div class="${cls.join(' ')}" ${ok?`data-i="${i}" data-d="${d}"`:''}>${inner}</div>`;
  }
  h+='</div>';
 }
 document.getElementById('cal').innerHTML=h;
 document.getElementById('b9').className=mon===9?'on':'';
 document.getElementById('b10').className=mon===10?'on':'';
 document.getElementById('b11').className=mon===11?'on':'';
 document.getElementById('b0').className=mon===0?'on':'';
}
function renderDet(){
 const i=sel,ds=[0,1,2,3,4,5].map(d=>dateOf(i,d)),end=dateOf(i,6);
 let o=`<div class="w">Неделя ${i%2+1} · ${ds[0].getDate()} ${MN[ds[0].getMonth()]} – ${end.getDate()} ${MN[end.getMonth()]}</div>`;
 for(let d=0;d<7;d++){const k=key(dateOf(i,d));if(HOL[k])o+=`<div class="bn">${k} — праздничный день (${HOL[k]}), занятий нет</div>`}
 if([0,1,2,3,4,5,6].some(d=>SES(dateOf(i,d))))o+='<div class="bn" style="color:var(--sesc)">Сессия: 5–11 января, обычных занятий нет</div>';
 if(selDay===6)o+='<div class="lg">Воскресенье — занятий нет.</div>';
 const g=ds.map((_,d)=>{const c=Array(10).fill(null);
  les(i,d).forEach(l=>{const r=l[0]*2+(l[1]===2?0:l[1]);c[r]={l};if(l[1]===2)c[r+1]='x'});return c});
 const md=selDay===null?((today>=ds[0]&&today<=end)?(today.getDay()+6)%7:0):selDay;
 o+='<div class="dt">'+[0,1,2,3,4,5].map(d=>`<button data-td="${d}" class="${md===d?'on':''} ${HOL[key(ds[d])]?'h':''}">${DN[d]}<br>${ds[d].getDate()}</button>`).join('')+'</div>';
 const mob=matchMedia('(max-width:699px)').matches,cols=mob?(md<6?[md]:[]):[0,1,2,3,4,5];
 if(!cols.length){document.getElementById('det').innerHTML=o;return}
 const hi=cols.findIndex(d=>key(ds[d])==='07.11');
 o+=`<div class="sc"><div class="tw">${hi>=0?`<div class="hbg" style="left:calc(var(--tw) + ${hi} * (100% - var(--tw)) / ${cols.length});width:calc((100% - var(--tw)) / ${cols.length})"></div>`:''}<table><tr><th class="t"></th>`;
 cols.forEach(d=>{const dt=ds[d];o+=`<th data-d="${d}" class="${HOL[key(dt)]?'hol':SES(dt)?'ses':''} ${selDay===d?'sel':''}">${DN[d]} ${key(dt)}</th>`});
 o+='</tr>';
 for(let s=0;s<5;s++){
  if(s===2)o+='<tr class="br"><td class="t"></td><td colspan="'+cols.length+'">обед 11:35–12:15</td></tr>';
  if(s===4)o+='<tr class="br"><td class="t"></td><td colspan="'+cols.length+'">большой перерыв 15:50–16:20</td></tr>';
  for(let h=0;h<2;h++){
   const r=s*2+h;o+=`<tr><td class="t">${T[s][2*h]}<br>${T[s][2*h+1]}</td>`;
   cols.forEach(d=>{const c=g[d];
    const x=c[r];if(x==='x')return;
    if(!x){o+=`<td data-d="${d}"></td>`;return}
    const l=x.l,fl=l[4]||'',hue=[...l[2]].reduce((a,ch)=>a*31+ch.charCodeAt(0),7)%360;
    const sub=fl==='hol'?'праздник':fl==='del'?'отмена':fl==='add'?'доп.'+(l[3]?' · '+l[3]:''):l[3];
    o+=`<td data-d="${d}" class="c ${fl==='hol'?'del hl':fl}" style="--h:${hue}" ${l[1]===2?'rowspan="2"':''}><b>${l[2]}</b><i>${sub}</i></td>`;
   });
   o+='</tr>';
  }
 }
 document.getElementById('det').innerHTML=o+'</table></div></div>';
}
document.getElementById('cal').addEventListener('click',e=>{
 const t=e.target.closest('[data-i]');if(!t)return;
 sel=+t.dataset.i;selDay=t.dataset.d===undefined?null:+t.dataset.d;
 renderCal();renderDet();
 requestAnimationFrame(()=>{const d=document.getElementById('det');window.scrollTo({top:d.getBoundingClientRect().top+window.scrollY-8,behavior:'smooth'})});
});
document.getElementById('det').addEventListener('click',e=>{const t=e.target.closest('[data-td]');if(!t)return;selDay=+t.dataset.td;renderCal();renderDet()});
document.getElementById('b9').onclick=()=>{mon=9;renderCal()};
document.getElementById('b10').onclick=()=>{mon=10;renderCal()};
document.getElementById('b11').onclick=()=>{mon=11;renderCal()};
document.getElementById('b0').onclick=()=>{mon=0;renderCal()};
renderCal();renderDet();
matchMedia('(max-width:699px)').addEventListener('change',()=>renderDet());(()=>{
const det=document.getElementById('det');let sx=0,sy=0;
det.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY},{passive:true});
det.addEventListener('touchend',e=>{
 if(!matchMedia('(max-width:699px)').matches)return;
 const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
 if(Math.abs(dx)<50||Math.abs(dx)<Math.abs(dy)*1.5)return;
 const step=dx<0?1:-1;
 let d=selDay;
 if(d===null)d=(today>=dateOf(sel,0)&&today<=dateOf(sel,6))?(today.getDay()+6)%7:0;
 let n=d===6?sel*6+5+(step>0?1:0):sel*6+d+step;
 if(n<0||n>83)return;
 sel=Math.floor(n/6);selDay=n%6;
 const m=dateOf(sel,selDay).getMonth();if([9,10,11,0].includes(m))mon=m;
 renderCal();renderDet();
 try{det.animate([{transform:`translateX(${step*30}px)`,opacity:.3},{transform:'none',opacity:1}],{duration:180})}catch(_){}
});
})();
(()=>{
const cal=document.getElementById('cal'),ord=[9,10,11,0];let sx=0,sy=0;
cal.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY},{passive:true});
cal.addEventListener('touchend',e=>{
 if(!matchMedia('(max-width:699px)').matches)return;
 const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
 if(Math.abs(dx)<50||Math.abs(dx)<Math.abs(dy)*1.5)return;
 const step=dx<0?1:-1,k=ord.indexOf(mon)+step;
 if(k<0||k>=ord.length)return;
 mon=ord[k];renderCal();
 try{cal.animate([{transform:`translateX(${step*30}px)`,opacity:.3},{transform:'none',opacity:1}],{duration:180})}catch(_){}
});
})();
</script></body></html>
